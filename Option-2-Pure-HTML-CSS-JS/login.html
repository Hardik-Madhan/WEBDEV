<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ==================================================================== -->
  <!--  CARESURE - LOGIN PAGE (PURE HTML)                                  -->
  <!--  Code for this page: User authentication form verifying credentials   -->
  <!--  against data/users.json and setting session in data/sessions.json.  -->
  <!-- ==================================================================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · CareSure</title>

  <!-- Separate CSS stylesheets -->
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/auth.css">
</head>
<body class="auth-page-container">

  <!-- Navigation Bar -->
  <header class="navbar-header">
    <div class="navbar-container">
      <a href="index.html" class="logo-brand">
        <span class="logo-icon-box">🤝</span>
        <span>Care<span class="highlight">Sure</span></span>
      </a>

      <nav class="nav-links-desktop">
        <a href="index.html" class="nav-link">Home</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="find.html" class="nav-link">Find Caretaker</a>
        <a href="caretaker.html" class="nav-link">Become a Caretaker</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>

      <div class="nav-actions-desktop">
        <a href="login.html" class="btn btn-outline" style="border-color:var(--primary); color:var(--primary); font-weight:700;">Login</a>
        <a href="signup.html" class="btn btn-outline">Sign Up</a>
      </div>
    </div>
  </header>

  <main class="auth-main-wrapper">
    <div class="auth-card-box">
      <p class="auth-category-tag">CARE SURE ACCOUNT</p>
      <h1 class="auth-card-title">Welcome back</h1>
      <p class="auth-card-desc">Log in to manage your care requests and profile.</p>

      <p class="auth-warning-banner">
        Prototype: credentials verify against local <code>data/users.json</code>.
      </p>

      <!-- Login Form: Validated by scripts/auth.js -->
      <form id="login-form" class="auth-form" novalidate>
        <label class="auth-field-label">
          Email address
          <input id="login-email" type="email" class="auth-input" placeholder="alex@example.com" required autocomplete="email">
        </label>

        <label class="auth-field-label">
          Password
          <input id="login-password" type="password" class="auth-input" required autocomplete="current-password" placeholder="••••••••">
        </label>

        <p id="auth-error" class="auth-error-alert" style="display:none;"></p>

        <button id="auth-submit-btn" type="submit" class="auth-submit-btn">
          Log in
        </button>
      </form>

      <p class="auth-footer-text">
        New to CareSure? <a href="signup.html" class="auth-footer-link">Create an account</a>
      </p>
    </div>
  </main>

  <script src="scripts/main.js"></script>
  <script src="scripts/auth.js"></script>
</body>
</html>
